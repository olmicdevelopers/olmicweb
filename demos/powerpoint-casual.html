<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo · PowerPoint Casual</title>
<meta name="theme-color" content="#3B3831">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#3B3831;--amber:#7E9A7C;--mist:#F4F5F8;--line:#DCE0EA;--gray:#6B7284}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--ink);color:#fff;font-family:Archivo,Helvetica,Arial,sans-serif;min-height:100svh;
display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
padding:14px min(4vw,26px);border-bottom:1px solid rgba(255,255,255,.12)}
.b{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1rem;letter-spacing:-.02em}
.b i{width:9px;height:9px;border-radius:50%;background:var(--amber)}
.b span{font-weight:400;font-size:.82rem;color:rgba(255,255,255,.5);margin-left:6px}
.cta{background:var(--amber);color:#1A1204;font-weight:700;font-size:.88rem;padding:11px 22px;
border-radius:10px;text-decoration:none;transition:transform .3s}
.cta:hover{transform:translateY(-2px)}
main{flex:1;display:grid;place-items:center;padding:20px min(4vw,26px) 8px}
.stage{width:min(1080px,100%);position:relative}
.stage img{width:100%;display:block;border-radius:10px;box-shadow:0 30px 70px -35px #000;background:#fff}
.hot{position:absolute;border-radius:8px;cursor:pointer;background:rgba(126,154,124,0);
border:2px solid rgba(126,154,124,0);transition:all .3s}
.hot:hover{background:rgba(126,154,124,.28);border-color:var(--amber)}
.tip{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:5;
background:rgba(20,26,46,.92);border:1px solid rgba(255,255,255,.18);padding:8px 16px;border-radius:99px;
font-size:.8rem;color:#fff;pointer-events:none;opacity:0;transition:opacity .4s}
.tip.on{opacity:1}
nav{display:flex;align-items:center;justify-content:center;gap:14px;padding:14px;flex-wrap:wrap}
button.nv{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#fff;
font-family:inherit;font-size:.9rem;padding:10px 18px;border-radius:10px;cursor:pointer;transition:all .3s}
button.nv:hover{background:rgba(255,255,255,.16)}
button.nv:disabled{opacity:.3;cursor:not-allowed}
.pos{font-size:.88rem;color:rgba(255,255,255,.6);min-width:150px;text-align:center}
.strip{display:flex;gap:7px;overflow-x:auto;padding:10px min(4vw,26px) 20px}
.strip img{height:56px;border-radius:5px;cursor:pointer;opacity:.45;transition:all .3s;flex:none;background:#fff}
.strip img:hover{opacity:.8}
.strip img.on{opacity:1;outline:2px solid var(--amber)}
@media (max-width:700px){.pos{min-width:0;width:100%;order:3}}
</style></head><body>

let i = 0;

const sl = document.getElementById('sl');
const pos = document.getElementById('pos');
const strip = document.getElementById('strip');
const zonas = document.getElementById('zonas');
const tip = document.getElementById('tip');

strip.innerHTML = S.map((s,n) => `<img src="${s}" data-n="${n}" alt="Diapositiva ${n+1}">`).join('');
const minis = [...strip.querySelectorAll('img')];

function zonasIndice(){
  zonas.innerHTML = '';
  tip.classList.remove('on');
  if (i !== 1) return;
  const celdas = [[5.26, 27.33, 37.97, 28.67, 2], [44.74, 27.33, 25.19, 28.67, 5], [71.43, 27.33, 23.31, 28.67, 8], [5.26, 58.67, 23.31, 28.67, 11], [30.08, 58.67, 25.19, 28.67, 14], [56.77, 58.67, 37.97, 28.67, 16]];
  celdas.forEach(c => {
    const d = document.createElement('div');
    d.className = 'hot';
    d.style.cssText = `left:${c[0]}%;top:${c[1]}%;width:${c[2]}%;height:${c[3]}%`;
    d.onclick = () => ir(c[4]);
    zonas.appendChild(d);
  });
  setTimeout(() => tip.classList.add('on'), 400);
  setTimeout(() => tip.classList.remove('on'), 5200);
}

function ir(n){
  i = Math.max(0, Math.min(S.length - 1, n));
  sl.src = S[i];
  sl.alt = 'Diapositiva ' + (i+1) + ': ' + T[i];
  pos.textContent = (i+1) + ' / ' + S.length + ' · ' + T[i];
  document.getElementById('prev').disabled = i === 0;
  document.getElementById('next').disabled = i === S.length - 1;
  minis.forEach((m,n2) => m.classList.toggle('on', n2 === i));
  minis[i].scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});
  zonasIndice();
}

document.getElementById('prev').onclick = () => ir(i-1);
document.getElementById('next').onclick = () => ir(i+1);
strip.onclick = e => { const m = e.target.closest('img'); if (m) ir(+m.dataset.n); };
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') ir(i+1);
  if (e.key === 'ArrowLeft') ir(i-1);
});
ir(0);
